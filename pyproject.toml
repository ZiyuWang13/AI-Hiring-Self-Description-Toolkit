[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "ai-hiring-self-description-toolkit"
version = "0.1.0"
description = "Privacy-preserving analysis primitives for multi-stage AI recruitment audits"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Ziyu Wang"}]
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "scipy>=1.12,<2",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.urls]
Repository = "https://github.com/ZiyuWang13/AI-Hiring-Self-Description-Toolkit"

[project.optional-dependencies]
dev = [
  "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/who_fits_where"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
